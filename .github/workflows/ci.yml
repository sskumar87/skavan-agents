name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Run tests
        run: uv run pytest -q

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Build standalone application
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare non-secret validation configuration
        run: |
          cp .env.example .env
          cp infra/docker/compose.laptop2.example.yml infra/docker/compose.laptop2.yml
      - name: Validate operations scripts and secret scoping
        shell: pwsh
        run: |
          bash -n infra/laptop1/backup-skavan.sh
          bash -n infra/laptop1/preflight.sh
          if (Select-String -Quiet -Pattern '^\s*env_file:' -Path infra/docker/compose.laptop2.example.yml) {
            throw 'Compose services must use explicit environment allowlists, not a shared env_file.'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'infra/laptop2/preflight.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors.Message -join '; ') }
      - name: Validate all Compose profiles
        run: docker compose --env-file .env -f infra/docker/compose.laptop2.yml --profile identity --profile hermes config --quiet

  containers:
    name: Container build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [api, web, compose]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          tags: skavan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
