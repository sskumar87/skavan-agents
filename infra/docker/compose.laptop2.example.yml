name: skavan-platform

x-zitadel-db-env: &zitadel-db-env
  ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN}

x-zitadel-runtime-env: &zitadel-runtime-env
  <<: *zitadel-db-env
  ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
  ZITADEL_EXTERNALPORT: 443
  ZITADEL_EXTERNALSECURE: "true"
  ZITADEL_TLS_ENABLED: "false"
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
  ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
  ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
  ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Skavan Login Client
  ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION}
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}/ui/v2/login/
  ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?authRequest=
  ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
  ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?samlRequest=
  ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"

# Laptop 2 service topology template.
# Copy to compose.laptop2.yml and supply values through a local .env file.
# Deployment values, image tags and immutable digests belong in the ignored
# local .env. The example remains safe to commit because it contains no secrets.

services:
  reverse-proxy:
    image: ${NGINX_IMAGE:?Set a reviewed, pinned NGINX_IMAGE locally}
    restart: unless-stopped
    volumes:
      - ../reverse-proxy/nginx.conf.example:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - app
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    # Set a reviewed, pinned image in the ignored deployment environment file.
    image: ${CLOUDFLARED_IMAGE:?Set a pinned CLOUDFLARED_IMAGE locally}
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    read_only: true
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:?Set CLOUDFLARED_CONFIG_DIR to the protected local secret directory}:/etc/cloudflared:ro
    depends_on:
      - reverse-proxy
    networks:
      - edge
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set a reviewed, pinned NODE_IMAGE locally}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser-visible configuration must never contain Hermes credentials.
      NEXT_PUBLIC_APP_ORIGIN: ${APP_ORIGIN}
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  api:
    build:
      context: ../../apps/api
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set a reviewed, pinned PYTHON_IMAGE locally}
    restart: unless-stopped
    environment:
      # Laptop 1 is a private data node. This URL is never published as a port.
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL}
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
    networks:
      - app
      - private-services
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ZITADEL v4 vendor lifecycle adapted for the remote Laptop 1 database.
  # The identity profile must be bootstrapped before normal application use.
  zitadel-init:
    image: ${ZITADEL_IMAGE:?Set a pinned, supported ZITADEL_IMAGE locally}
    profiles: ["identity"]
    restart: "no"
    command: init
    environment:
      <<: *zitadel-db-env
    networks:
      - service-egress

  zitadel-setup:
    image: ${ZITADEL_IMAGE:?Set a pinned, supported ZITADEL_IMAGE locally}
    profiles: ["identity"]
    restart: "no"
    command: setup --masterkeyFile /run/secrets/zitadel-masterkey
    environment:
      <<: *zitadel-runtime-env
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    secrets:
      - zitadel-masterkey
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
    networks:
      - service-egress

  zitadel-api:
    image: ${ZITADEL_IMAGE:?Set a pinned, supported ZITADEL_IMAGE locally}
    profiles: ["identity"]
    restart: unless-stopped
    command: start --masterkeyFile /run/secrets/zitadel-masterkey
    environment:
      <<: *zitadel-runtime-env
      ZITADEL_PORT: 8080
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    secrets:
      - zitadel-masterkey
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
      zitadel-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      start_period: 20s
      retries: 12
    networks:
      - edge
      - service-egress
    labels:
      - traefik.enable=true
      - traefik.docker.network=skavan-edge
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false
      - traefik.http.routers.zitadel-api-alias.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api-alias.entrypoints=web
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      - traefik.http.routers.zitadel-canonical.rule=Host(`${ZITADEL_DOMAIN}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-canonical.entrypoints=web
      - traefik.http.routers.zitadel-canonical.service=zitadel-api
      - traefik.http.routers.zitadel-canonical.priority=100

  zitadel-login:
    image: ${ZITADEL_LOGIN_IMAGE:?Set a pinned ZITADEL_LOGIN_IMAGE locally}
    profiles: ["identity"]
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      start_period: 20s
      retries: 12
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=skavan-edge
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.zitadel-root-rewrite.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`${ZITADEL_DOMAIN}`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=web
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-rewrite
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      - traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=web
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250

  zitadel-proxy:
    image: ${TRAEFIK_IMAGE:?Set a pinned TRAEFIK_IMAGE locally}
    profiles: ["identity"]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skavan-edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_IPS:-172.16.0.0/12}
      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      - --ping.entrypoint=web
      - --accesslog=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - edge

  # Hermes is deliberately represented as an internal-only boundary. Add its
  # exact upstream image/command/config only after those runtime choices are
  # verified. The API must be its sole product-facing caller.
  hermes:
    image: ${HERMES_IMAGE:?Set a verified, pinned Hermes image locally}
    profiles: ["hermes"]
    restart: unless-stopped
    command: gateway run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      HERMES_DASHBOARD: "0"
    volumes:
      - hermes-data:/opt/data
    networks:
      - private-services
      - service-egress

networks:
  # Sole ingress path: Cloudflare Tunnel -> reverse proxy.
  edge:
    name: skavan-edge
  # Reverse proxy, web, API and ZITADEL's browser-facing OIDC endpoints.
  app: {}
  # API-to-Hermes, API-to-Laptop-1 PostgreSQL, and service administration only.
  private-services:
    internal: true
  # Outbound-only path for Hermes cloud model/provider calls. It is not
  # attached to the reverse proxy or Cloudflare ingress.
  service-egress: {}

volumes:
  hermes-data: {}
  zitadel-bootstrap: {}

secrets:
  zitadel-masterkey:
    file: ${ZITADEL_MASTERKEY_FILE:?Set the protected ZITADEL master-key file path}
