name: skavan-phase1

services:
  reverse-proxy:
    image: nginx:stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../reverse-proxy/nginx.conf.example:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [app]

  web:
    build:
      context: ../../apps/web
      args:
        NODE_IMAGE: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  api:
    build:
      context: ../../apps/api
      args:
        PYTHON_IMAGE: python:3.13.14-slim-bookworm@sha256:67a1e1f215ccda113cfc024e8639049257e88f273898f595b61476d128d387e8
    environment:
      HERMES_API_BASE_URL: http://hermes:8642
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Run configure-phase1.ps1 first}
      HERMES_MODEL: hermes-agent
    depends_on:
      hermes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app, private-services]

  hermes:
    image: nousresearch/hermes-agent:v2026.8.18@sha256:22e37bb4ed1b0f50cb6bd991dca7ecacd6c9f29df9b4a20fc989d32bc763ccf6
    command: gateway run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Run configure-phase1.ps1 first}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Run configure-phase1.ps1 first}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Run configure-phase1.ps1 first}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Run configure-phase1.ps1 first}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Run configure-phase1.ps1 first}
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - ${HERMES_DATA_DIR:-C:/SKAV_PLATFORM/secrets/skavan-phase1}:/opt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 18
    networks: [private-services, egress]

networks:
  app: {}
  private-services:
    internal: true
  egress: {}
