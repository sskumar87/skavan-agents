name: skavan-phase1

services:
  reverse-proxy:
    image: nginx:stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../reverse-proxy/nginx.conf.example:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [app]

  web:
    build:
      context: ../../apps/web
      args:
        NODE_IMAGE: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      AUTH_URL: ${APP_ORIGIN:?Configure the public application origin}
      AUTH_SECRET: ${AUTH_SECRET:?Configure ZITADEL login first}
      AUTH_TRUST_HOST: "true"
      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE:-3600}
      ZITADEL_ISSUER_URL: ${ZITADEL_ISSUER_URL:?Configure ZITADEL login first}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?Configure ZITADEL login first}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app, identity]

  api:
    build:
      context: ../../apps/api
      args:
        PYTHON_IMAGE: python:3.13.14-slim-bookworm@sha256:67a1e1f215ccda113cfc024e8639049257e88f273898f595b61476d128d387e8
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure the Laptop 1 product database}
      OIDC_ISSUER_URL: ${ZITADEL_ISSUER_URL:?Configure ZITADEL login first}
      OIDC_CLIENT_ID: ${ZITADEL_CLIENT_ID:?Configure ZITADEL login first}
      # Retrieve signing keys privately; token issuer validation remains public.
      OIDC_JWKS_URL: http://zitadel-proxy:8081/oauth/v2/keys
      ZITADEL_MANAGEMENT_BASE_URL: http://zitadel-proxy:8081
      ZITADEL_ROLE_PROVISIONER_TOKEN: ${ZITADEL_ROLE_PROVISIONER_TOKEN:?Configure the registration role provisioner}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:?Configure the Skavan ZITADEL project}
      ZITADEL_ORGANIZATION_ID: ${ZITADEL_ORGANIZATION_ID:?Configure the Skavan ZITADEL organization}
      HERMES_API_BASE_URL: http://hermes:8642
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Run configure-phase1.ps1 first}
      HERMES_WORK_API_SERVER_KEY: ${HERMES_WORK_API_SERVER_KEY:?Configure the Work Hermes profile}
      HERMES_MODEL: hermes-agent
    depends_on:
      hermes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app, private-services, identity]

  hermes:
    image: nousresearch/hermes-agent:v2026.8.18@sha256:22e37bb4ed1b0f50cb6bd991dca7ecacd6c9f29df9b4a20fc989d32bc763ccf6
    command: gateway run
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Run configure-phase1.ps1 first}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Run configure-phase1.ps1 first}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Run configure-phase1.ps1 first}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Run configure-phase1.ps1 first}
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - ${HERMES_DATA_DIR:-C:/SKAV_PLATFORM/secrets/skavan-phase1/hermes}:/opt/data
      - ${SKAV_PLATFORM_DIR:-C:/SKAV_PLATFORM}:/workspace:ro
      - hermes-workspace-secrets-mask:/workspace/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 18
    networks: [private-services, egress]

  zitadel-proxy:
    image: traefik:v3.7.7@sha256:1cb3845d7a05e1473c9086351426597e911db49db382b6e4769f9b0744962ac8
    profiles: [identity]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skavan-phase1-identity
      - --entrypoints.web.address=:8081
      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      identity:
        aliases: [auth.localhost]

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.17.1@sha256:3ac6910685d48f32481f01f45e3e6215efe5a9df2c069591b481e9a101712db5
    profiles: [identity]
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkeyFile /run/secrets/zitadel-masterkey
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:?Configure the ZITADEL hostname}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-443}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNAL_SECURE:-true}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN:?Configure the Laptop 1 ZITADEL database}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:?Configure the initial ZITADEL administrator}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Skavan Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION:-2027-08-21T00:00:00Z}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${ZITADEL_ISSUER_URL:?Configure the ZITADEL issuer}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${ZITADEL_ISSUER_URL:?Configure the ZITADEL issuer}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${ZITADEL_ISSUER_URL:?Configure the ZITADEL issuer}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${ZITADEL_ISSUER_URL:?Configure the ZITADEL issuer}/ui/v2/login/login?samlRequest=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    secrets: [zitadel-masterkey]
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      start_period: 20s
      retries: 12
    networks: [identity, egress]
    labels:
      - traefik.enable=true
      - traefik.docker.network=skavan-phase1-identity
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.routers.zitadel-api-alias.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api-alias.entrypoints=web
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      - traefik.http.routers.zitadel-canonical.rule=Host(`${ZITADEL_DOMAIN}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-canonical.entrypoints=web
      - traefik.http.routers.zitadel-canonical.service=zitadel-api
      - traefik.http.routers.zitadel-canonical.priority=100

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.1@sha256:8035df2409afb35a3999482ee98e453261715f98d47e4b62e948e4a1ddf4345f
    profiles: [identity]
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:${ZITADEL_EXTERNAL_SCHEME:-https}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      start_period: 20s
      retries: 12
    networks: [identity]
    labels:
      - traefik.enable=true
      - traefik.docker.network=skavan-phase1-identity
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.zitadel-root-rewrite.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`${ZITADEL_DOMAIN}`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=web
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-rewrite
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      - traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=web
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250

networks:
  app: {}
  private-services:
    internal: true
  egress: {}
  identity:
    name: skavan-phase1-identity

volumes:
  hermes-workspace-secrets-mask: {}
  zitadel-bootstrap: {}

secrets:
  zitadel-masterkey:
    file: ${ZITADEL_MASTERKEY_FILE:?Configure the protected ZITADEL master key file}
